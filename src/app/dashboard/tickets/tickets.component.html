
<div>
    <ul>
        @for (ticket of tickets; track ticket.id) {
            <li>
                <app-ticket  [ticketData]="ticket"  (close)="onCloseTicket(ticket.id)"/>   <!--    "-{{$count}}"    -->
            </li>
        } @empty {
            <p>No Tickets Available</p>
        }
    
    </ul>
</div>
      
<div id="new-ticket">
    <app-new-ticket  (add)="onAdd($event)"/>
</div>

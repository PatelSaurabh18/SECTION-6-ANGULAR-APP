
<form>
<app-control  class="control" label="Title">
    <input type="text"  id="title" name="title" placeholder="write title name hare...." required>

</app-control>
 
<app-control  class="control" label="Request">
    /*
   we can use css class here because due to encapsulation, the css scope of a component app-control is global so ":host"
    solution won't work, so we can add the class itself here so our styles don't break.
    */
    <textarea name="request" id="request" rows="3" required></textarea>    
</app-control>

        Submit 
        <span ngProjectAs="icon"> ⧐ </span>

</p>
</form>


<form  (ngSubmit)="onSubmit({title :  titleInput.value,ticketText : textInput.value,form: form})"  #form>
<app-control label="Title">
    <input type="text"  id="title" name="title" placeholder="write title name hare...." required  #titleInput >
<!-- by default when we use Template Variable, we get access to  DOM element and if we are putting Template Variable
  on one of our custom made components(appButton/app-control) then we get access  to the component instance instead. 
  so we have to use this Template Variable with the default DOM elements like input etc-->
</app-control>
 
<app-control  label="Request" >
  
    <textarea id="request" rows="3" required  #textInput></textarea>    
</app-control>

<p>
    <!-- <app-button btnText="Submit" btnSymbol="⧐"/> -->
     <!-- <button appButton btnText="Submit" btnSymbol="⧐"></button> -->
      <button appButton  > 
        Submit 
        <span ngProjectAs="icon"> ⧐ </span>
    </button>
</p>
</form>

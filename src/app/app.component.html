<app-header />

<main>
  <div id="dashboard">

  <app-dashboard-item [image]="{src:'status.png' , alt:'A  signal symbol'}" 
  title="Server Status">
    <app-server-dashboard />
    
      <!-- here if we use [] with title then TS would try to evaluate it and try to find the value of the value given for title so 
      will cause error , so if we want to give plane text which doesn't need to be evaluated then don't use [] (property binding)
      or we can do this :-
      [title]="'Hello'" -> now this value will be treated as a plane string -->
    

  </app-dashboard-item>

  <app-dashboard-item [image]="{src:'globe.png' , alt:'A  globe'}" 
  title="Traffic">
    <app-traffic-dashboard />

  </app-dashboard-item>
 
  <app-dashboard-item [image]="{src:'list.png' , alt:'A  list of items'}"
   title="Support Tickets">

    <app-todo />

  </app-dashboard-item>

  </div>
</main>
